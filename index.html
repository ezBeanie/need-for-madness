<!DOCTYPE html>
<html lang="en">
<head>
<title>Need for Madness</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15190D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body { margin: 0px; padding: 0px; overflow: hidden; }
@font-face
{
font-family: junk;
src: url(data/JunkDog.ttf);
}
@font-face
{
font-family: verd;
src: url(data/verdana.ttf);
}
/* the options and multiplayer: switches without keys and races together (see src/ui/) */
.options-button, .multiplayer-button {
  position: fixed; top: 8px; right: 76px; width: 44px; height: 44px;
  border-radius: 22px; border: 1px solid rgba(1, 234, 255, 0.6);
  background: rgba(0, 16, 32, 0.7); color: #ffffff; font-size: 24px; line-height: 1;
  cursor: pointer;
}
.multiplayer-button {
  right: 128px; width: auto; padding: 0 16px; font-family: verd, Verdana, sans-serif;
  font-size: 15px;
}
.options-button:focus-visible, .multiplayer-button:focus-visible,
.menu-dialog button:focus-visible, .menu-dialog input:focus-visible {
  outline: 3px solid #ffffff; outline-offset: 2px;
}
.menu-dialog {
  width: min(90vw, 420px); padding: 16px 20px; border: 1px solid rgba(1, 234, 255, 0.6);
  border-radius: 14px; background: rgba(0, 16, 32, 0.94); color: #ffffff;
  font-family: verd, Verdana, sans-serif;
}
.menu-dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
.menu-dialog h2 { margin: 0 0 12px; font-size: 20px; }
.menu-dialog p { margin: 0 0 12px; font-size: 14px; line-height: 1.4; }
.menu-dialog ul { list-style: none; margin: 0; padding: 0; }
.menu-dialog li + li { margin-top: 8px; }
.menu-dialog button {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  width: 100%; min-height: 44px; padding: 8px 14px; border: 0; border-radius: 22px;
  background: rgba(255, 255, 255, 0.1); color: #ffffff; font: inherit; font-size: 15px;
  text-align: left; cursor: pointer;
}
.menu-dialog button:hover { background: rgba(1, 234, 255, 0.25); }
.menu-dialog button:disabled { opacity: 0.55; cursor: not-allowed; background: transparent; }
#options .hint { display: block; color: rgba(160, 230, 255, 0.8); font-size: 12px; }
.menu-dialog label { display: block; margin: 16px 0 6px; font-size: 14px; }
.menu-dialog input {
  box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 14px;
  border: 1px solid rgba(1, 234, 255, 0.6); border-radius: 22px;
  background: rgba(0, 0, 0, 0.4); color: #ffffff; font: inherit; font-size: 15px;
}
.menu-dialog input + button, .menu-dialog .error + button { margin-top: 8px; }
.menu-dialog .error { margin: 6px 0 0; color: #ffb4a8; }
.menu-dialog .error::before { content: "\26A0  "; }
.menu-dialog .room { font-size: 26px; letter-spacing: 3px; color: #01eaff; }
#options .state { color: #01eaff; font-weight: bold; white-space: nowrap; }
#options .key { color: rgba(160, 230, 255, 0.8); font-size: 12px; }
.menu-dialog .close { justify-content: center; margin-top: 14px; }
/* the stage editor: a bar of tools, the palette of pieces and the map (see src/editor/) */
.editor-button {
  position: fixed; top: 60px; right: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 22px; border: 1px solid rgba(1, 234, 255, 0.6);
  background: rgba(0, 16, 32, 0.7); color: #ffffff; font-family: verd, Verdana, sans-serif;
  font-size: 15px; cursor: pointer;
}
.stage-editor {
  box-sizing: border-box; width: 100vw; height: 100vh; max-width: none; max-height: none;
  margin: 0; padding: 0; border: 0; background: #0b1418; color: #ffffff;
  font-family: verd, Verdana, sans-serif;
}
.stage-editor[open] {
  display: grid; grid-template-columns: 230px 1fr 260px; grid-template-rows: auto 1fr auto;
  height: 100vh;
}
.stage-editor .editor-bar {
  grid-column: 1 / 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid rgba(1, 234, 255, 0.4);
}
.stage-editor h2 { margin: 0 8px 0 0; font-size: 18px; }
.stage-editor .editor-bar .spacer { flex: 1; }
.stage-editor button {
  min-height: 44px; padding: 6px 14px; border: 1px solid rgba(1, 234, 255, 0.4);
  border-radius: 22px; background: rgba(255, 255, 255, 0.08); color: #ffffff;
  font: inherit; font-size: 14px; cursor: pointer;
}
.stage-editor button:hover { background: rgba(1, 234, 255, 0.25); }
.stage-editor button:disabled { opacity: 0.45; cursor: not-allowed; background: transparent; }
.stage-editor button:focus-visible, .stage-editor input:focus-visible,
.stage-editor canvas:focus-visible, .editor-button:focus-visible {
  outline: 3px solid #ffffff; outline-offset: 2px;
}
.stage-editor input {
  min-height: 44px; box-sizing: border-box; padding: 6px 14px; border-radius: 22px;
  border: 1px solid rgba(1, 234, 255, 0.6); background: rgba(0, 0, 0, 0.4); color: #ffffff;
  font: inherit; font-size: 14px;
}
.stage-editor .label { font-size: 14px; }
#editorPalette { overflow-y: auto; padding: 4px 10px 12px; border-right: 1px solid rgba(1, 234, 255, 0.4); }
#editorPalette h3 { margin: 12px 0 6px; font-size: 14px; color: #01eaff; }
#editorPalette ul { list-style: none; margin: 0; padding: 0; }
#editorPalette button {
  display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 4px;
  padding: 2px 10px 2px 2px; border-radius: 10px; text-align: left;
}
#editorPalette button[aria-pressed="true"] { background: rgba(1, 234, 255, 0.35); border-color: #01eaff; }
#editorPalette canvas { width: 40px; height: 40px; flex: none; }
#editorMap { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; min-height: 0; }
#editorInspector { overflow-y: auto; padding: 4px 12px 12px; border-left: 1px solid rgba(1, 234, 255, 0.4); font-size: 14px; }
#editorInspector h3 { margin: 12px 0 6px; font-size: 14px; color: #01eaff; }
#editorInspector p { margin: 6px 0; line-height: 1.4; }
#editorInspector .piece { font-weight: bold; }
#editorInspector label { display: block; margin: 10px 0 4px; }
#editorInspector .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
#editorInspector .row label { display: inline; margin: 0; }
#editorInspector .row input[type="checkbox"] { width: 22px; height: 22px; margin: 0; flex: none; }
#editorInspector select, #editorInspector input[type="number"] {
  box-sizing: border-box; width: 100%; min-height: 44px; padding: 6px 10px; border-radius: 10px;
  border: 1px solid rgba(1, 234, 255, 0.6); background: rgba(0, 0, 0, 0.4); color: #ffffff; font: inherit;
}
#editorInspector select:focus-visible, #editorInspector input:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
#editorProblems { list-style: none; margin: 0; padding: 0; }
#editorProblems li { margin-top: 6px; color: #ffd2c8; }
#editorProblems .ready { color: #9ff5b4; }
#editorProblems .ready::before { content: "\2713  "; }
#editorProblems li:not(.ready)::before { content: "\26A0  "; }
#editorProblems button { width: 100%; text-align: left; border-radius: 10px; color: #ffd2c8; }
#editorSettings select { box-sizing: border-box; width: 100%; min-height: 44px; padding: 8px 14px; border: 1px solid rgba(1, 234, 255, 0.6); border-radius: 22px; background: rgba(0, 0, 0, 0.4); color: #ffffff; font: inherit; font-size: 15px; }
#editorSettings .row { display: flex; gap: 8px; }
#editorSettings .row button { width: auto; flex: none; justify-content: center; }
#editorSettings .colors { display: grid; grid-template-columns: auto 1fr auto 1fr; align-items: center; gap: 8px 10px; margin-top: 16px; }
#editorSettings .colors label { margin: 0; }
#editorSettings input[type="color"] { min-height: 44px; padding: 2px; border-radius: 10px; }
#editorSettings select:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
#editorStatus { grid-column: 1 / 4; margin: 0; padding: 8px 12px; font-size: 14px; border-top: 1px solid rgba(1, 234, 255, 0.4); }
</style>
<script src="gl-matrix-min.js"></script>

</head>

<body bgcolor=#15190D link=#D3F2FF alink=#D3F2FF vlink=#D3F2FF leftmargin=0 topmargin=0 margin=0 marginheight=0 marginwidth=0>

<table id=loading style="position: absolute; left: 0px; top: 0px; width: 100%; height: 100%">
<td valign=center align=center>
<span style='font-family:Verdana, Arial; font-size:14px;'>
<font color=#6DCA00><b>Loading, please wait...</b></font>
</span>
</td>
</table>

<canvas id="canvas3D" style="position: absolute; left: 0px; top: 0px; padding-left: 0; padding-right: 0; margin-right: auto; margin-left: auto; display: block; width: 1280px; height: 720px;" width=1280 height=720></canvas>
<canvas id="canvas2D" style="position: absolute; left: 0px; top: 0px; padding-left: 0; padding-right: 0; margin-right: auto; margin-left: auto; display: block; width: 1280px; height: 720px;" width=1280 height=720></canvas>


<button type="button" id="optionsButton" class="options-button" aria-label="Options" aria-haspopup="dialog" aria-controls="options" hidden>&#9881;</button>
<dialog id="options" class="menu-dialog" aria-labelledby="optionsTitle">
<h2 id="optionsTitle">Options</h2>
<ul>
<li><button type="button" id="option-toggleLook" aria-pressed="false"><span>Look <span class="key">L</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-toggleSharp" aria-pressed="false"><span>Classic pixels <span class="key">K</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-toggleDepth" aria-pressed="false"><span>Classic polygons <span class="key">J</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-toggleClassicMenus" aria-pressed="false"><span>Classic menus and HUD <span class="key">U</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-toggleAiming" aria-pressed="false"><span>Camera turns to the arrow's car <span class="key">T</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-toggleMinimap" aria-pressed="false"><span>Minimap <span class="key">G</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-muteSound" aria-pressed="false"><span>Sound <span class="key">N</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-muteMusic" aria-pressed="false"><span>Music <span class="key">M</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-otherCarSounds" aria-pressed="false"><span>Other cars' sounds <span class="key">O</span></span><span class="state"></span></button></li>
<li><button type="button" id="option-toggleCareer" aria-pressed="false" aria-describedby="careerHint"><span>Career<span class="hint" id="careerHint">Stages and cars open one by one; switched in the main menu</span></span><span class="state"></span></button></li>
</ul>
<button type="button" id="optionsClose" class="close">Close</button>
</dialog>

<button type="button" id="stageEditorButton" class="editor-button" aria-haspopup="dialog" aria-controls="stageEditor" hidden>Stage Editor</button>
<dialog id="stageEditor" class="stage-editor" aria-labelledby="stageEditorTitle">
<div class="editor-bar">
<h2 id="stageEditorTitle">Stage Editor</h2>
<label class="label" for="editorName">Name</label>
<input id="editorName" type="text" maxlength="40" autocomplete="off">
<button type="button" id="editorNew">New</button>
<button type="button" id="editorUndo" aria-keyshortcuts="Control+Z">Undo</button>
<button type="button" id="editorRedo" aria-keyshortcuts="Control+Y">Redo</button>
<button type="button" id="editorRotate" aria-keyshortcuts="R">Turn</button>
<button type="button" id="editorDelete" aria-keyshortcuts="Delete">Delete</button>
<button type="button" id="editorOrder" aria-pressed="false">Order path</button>
<button type="button" id="editorSettingsButton" aria-haspopup="dialog" aria-controls="editorSettings">Settings</button>
<button type="button" id="editorTestDrive" aria-describedby="editorProblemsTitle">Test drive</button>
<span class="spacer"></span>
<button type="button" id="editorClose">Close</button>
</div>
<nav id="editorPalette" aria-label="Pieces"></nav>
<canvas id="editorMap" tabindex="0" role="img" aria-label="The stage from above"></canvas>
<aside id="editorInspector" aria-label="Selected piece and problems">
<section aria-labelledby="editorSelectedTitle"><h3 id="editorSelectedTitle">Selected</h3><div id="editorSelected"></div></section>
<section aria-labelledby="editorProblemsTitle"><h3 id="editorProblemsTitle">Check</h3><ul id="editorProblems"></ul></section>
</aside>
<p id="editorStatus" aria-live="polite"></p>
<dialog id="editorSettings" class="menu-dialog" aria-labelledby="editorSettingsTitle">
<h2 id="editorSettingsTitle">Stage settings</h2>
<form id="editorSettingsForm" method="dialog">
<label for="settingLaps">Laps</label>
<input id="settingLaps" type="number" min="1" max="15" step="1">
<label for="settingLevel">Opponents as strong as on</label>
<select id="settingLevel"></select>
<label for="settingMusic">Music of</label>
<select id="settingMusic"></select>
<label for="settingLookFrom">Look like</label>
<div class="row"><select id="settingLookFrom"></select><button type="button" id="settingCopyLook">Copy look</button></div>
<div class="colors">
<label for="settingSky">Sky</label><input id="settingSky" type="color">
<label for="settingFog">Fog</label><input id="settingFog" type="color">
<label for="settingGround">Ground</label><input id="settingGround" type="color">
<label for="settingCloudColor">Clouds</label><input id="settingCloudColor" type="color">
</div>
<label for="settingClouds">Cloud cover</label>
<select id="settingClouds"><option value="0">Overcast</option><option value="1">Cloudy</option><option value="2">A few clouds</option></select>
<label for="settingDistance">How far one sees</label>
<input id="settingDistance" type="number" min="4000" max="20000" step="500">
<button type="submit" class="close">Done</button>
</form>
</dialog>
</dialog>
<button type="button" id="multiplayerButton" class="multiplayer-button" aria-haspopup="dialog" aria-controls="multiplayer" hidden>Multiplayer</button>
<dialog id="multiplayer" class="menu-dialog" aria-labelledby="multiplayerTitle">
<h2 id="multiplayerTitle">Multiplayer</h2>
<div id="multiplayerChoose">
<p>Race a friend: one of you hosts, the other joins with the host's code.</p>
<button type="button" id="multiplayerHost">Host a race</button>
<form id="multiplayerJoinForm" novalidate>
<label for="multiplayerCode">Code of the host's room</label>
<input id="multiplayerCode" name="room" maxlength="32" required aria-required="true" aria-describedby="multiplayerCodeError" autocomplete="off" autocapitalize="none" spellcheck="false">
<p id="multiplayerCodeError" class="error" role="alert" hidden></p>
<button type="submit">Join the race</button>
</form>
</div>
<div id="multiplayerRoom" hidden>
<p>Room <strong id="multiplayerRoomName" class="room"></strong></p>
<div id="multiplayerShare">
<label for="multiplayerLink">Link for your guest</label>
<input id="multiplayerLink" readonly>
<button type="button" id="multiplayerCopy">Copy</button>
</div>
<p id="multiplayerStatus" role="status"></p>
<button type="button" id="multiplayerLeave">Leave the room</button>
</div>
<button type="button" id="multiplayerClose" class="close">Close</button>
</dialog>

<script type="module" src="/src/game.js"></script>
</body>
</html>
