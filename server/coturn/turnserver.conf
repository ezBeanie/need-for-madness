# coturn, the STUN and TURN server of the voice chat (see server/ice.js and docs/multiplayer.md,
# "TURN einrichten"). The secret it shares with the relay is added as it starts (start.sh),
# never kept here.

listening-port=3478
# the ports it relays the voices on, forwarded in the router as 3478 is
min-port=49160
max-port=49200

fingerprint
# logins the relay makes with the shared secret, each good for a day (TURN REST API)
use-auth-secret
realm=nfm

# no TLS of its own, no admin console
no-tls
no-dtls
no-cli

# Anyone loading the game gets a login: it relays only to the internet, never into the
# networks of the server itself (home network, Docker, Tailscale, loopback).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# voices only: a few relays per login, 32 kB/s each (an Opus voice needs about 5)
user-quota=12
total-quota=200
max-bps=32000

# no log of who connected (their addresses)
no-stdout-log
log-file=/dev/null
